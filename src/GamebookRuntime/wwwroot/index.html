<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gamebook</title>
<link rel="preload" href="styles.css" as="style">
<link rel="preload" href="app.js" as="script">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="app" class="app">
  <!-- Start screen / branch selection / story are rendered here -->
  <div class="loading" id="loading">…</div>
</main>
<!-- Utility rail: save + theme. Lives outside #app, so it is never re-rendered and
     stays reachable on every screen without taking the story's prime top spot. -->
<div class="util-rail" id="util-rail">
  <button class="btn btn-icon btn-back hidden" id="btn-back" title="back" aria-label="back"></button>
  <button class="btn btn-icon btn-save" id="btn-save" title="save" aria-label="save"></button>
  <button class="btn btn-icon btn-theme" id="btn-theme" title="theme" aria-label="theme"></button>
</div>
<template id="tpl-start">
  <section class="screen start">
    <h1 class="title"></h1>
    <p class="author"></p>
    <div class="intro hidden"></div>
    <button class="btn btn-primary btn-begin"></button>
    <div class="saves hidden">
      <h2 class="saves-title"></h2>
      <div class="saves-list"></div>
    </div>
  </section>
</template>
<template id="tpl-save-item">
  <div class="save-item">
    <div class="save-info"><strong class="save-name"></strong><span class="save-meta"></span></div>
    <div class="save-actions">
      <button class="btn btn-small btn-load"></button>
      <button class="btn btn-small btn-secondary btn-delete"></button>
    </div>
  </div>
</template>
<template id="tpl-node">
  <article class="screen node">
    <div class="node-image hidden"><img alt=""></div>
    <div class="node-text"></div>
    <div class="node-options"></div>
    <div class="node-end hidden"></div>
  </article>
</template>
<template id="tpl-option">
  <button class="btn btn-option"></button>
</template>
<template id="tpl-dice">
  <div class="dice-block">
    <div class="dice-text"></div>
    <div class="dice-success hidden"></div>
    <div class="dice-result hidden"><span class="dice-value"></span></div>
    <div class="dice-actions">
      <button class="btn btn-dice-roll"></button>
    </div>
  </div>
</template>
<script src="app.js"></script>
</body>
</html>
